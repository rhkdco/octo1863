<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>장르별 유튜브 음악 추천</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f9fafb;
      padding: 40px;
    }
    select {
      padding: 10px;
      font-size: 1em;
      margin-bottom: 20px;
    }
    .video-container {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>🎧 음악 장르를 선택하세요</h1>
  <label for="genre">장르:</label>
  <select id="genre">
    <option value="pop">Pop</option>
    <option value="rock">Rock</option>
    <option value="jazz">Jazz</option>
  </select>
  <div class="video-container" id="videoContainer"></div>

  <script>
    const musicVideos = {
      pop: ["gdZLi9oWNZg", "3tmd-ClpJxA", "JGwWNGJdvx8"],
      rock: ["fJ9rUzIMcZQ", "ktvTqknDobU", "pAgnJDJN4VA"],
      jazz: ["HMnrl0tmd3k", "vmDDOFXSgAs", "zKZ6skm3n4I"]
    };

    const genreSelect = document.getElementById("genre");
    const videoContainer = document.getElementById("videoContainer");

    genreSelect.addEventListener("change", () => {
      const selectedGenre = genreSelect.value;
      const videos = musicVideos[selectedGenre];
      const randomVideo = videos[Math.floor(Math.random() * videos.length)];
      const embedUrl = `https://www.youtube.com/embed/${randomVideo}`;

      videoContainer.innerHTML = `
        <iframe width="560" height="315"
                src="${embedUrl}"
                frameborder="0"
                allow="autoplay; encrypted-media"
                allowfullscreen></iframe>
      `;
    });
  </script>
</body>
</html>
